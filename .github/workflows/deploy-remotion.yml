name: Deploy Remotion Lambda site

# Redeploys the Remotion composition to S3 whenever it changes, so a code
# change (caption position, visuals, styling) reaches actual rendered videos
# instead of only the in-app preview, which is served straight from Vercel.
#
# Keeps the site name fixed ("clipforge") so the Serve URL stored in
# REMOTION_SERVE_URL on Vercel never changes — this redeploys the existing
# site in place rather than creating a new one to point at. It is the app's
# former name and stays so through the rename to VidiSprint: renders would
# otherwise keep using a stale copy of the composition.

on:
  push:
    branches: [claude/ai-video-creation-platform-hihlkr]
    paths:
      - "src/remotion/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Deploy Remotion site
        env:
          RAW_ACCESS_KEY_ID: ${{ secrets.REMOTION_AWS_ACCESS_KEY_ID }}
          RAW_SECRET_ACCESS_KEY: ${{ secrets.REMOTION_AWS_SECRET_ACCESS_KEY }}
        run: |
          # A secret pasted from a phone often carries a stray space or newline,
          # which AWS rejects as a malformed credential. GitHub never shows a
          # secret back, so that can't be spotted by eye — strip it here instead.
          # AWS keys never contain whitespace, so this can't corrupt a good one.
          export REMOTION_AWS_ACCESS_KEY_ID="$(printf '%s' "$RAW_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export REMOTION_AWS_SECRET_ACCESS_KEY="$(printf '%s' "$RAW_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          export REMOTION_AWS_REGION=us-east-1
          if [ "${#REMOTION_AWS_ACCESS_KEY_ID}" -ne 20 ]; then
            echo "REMOTION_AWS_ACCESS_KEY_ID is ${#REMOTION_AWS_ACCESS_KEY_ID} characters; an AWS access key id is 20 and starts with AKIA. The two secrets may be swapped." >&2
            exit 1
          fi
          npx remotion lambda sites create src/remotion/index.ts --site-name=clipforge
